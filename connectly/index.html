<!DOCTYPE html><html class="h-full dark" lang="en" ><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Creative Studio Canvas</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  // The config has to be set AFTER the CDN script: the CDN creates
  // window.tailwind when it loads and overwrites anything set before it.
  // With the config before the CDN, "tailwind" was still undefined (which
  // threw a ReferenceError) and darkMode:'class' was silently dropped, so
  // Tailwind used prefers-color-scheme instead of the theme toggle button.
  tailwind.config = {
    darkMode: 'class'
  };
</script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script>
  // Apply the saved theme before React mounts, otherwise the page would flash
  // the dark theme first when the user picked light mode.
  (function initStoredTheme() {
    try {
      var saved = window.localStorage.getItem('connectly-theme');
      var dark = saved ? saved === 'dark' : true;
      document.documentElement.classList.toggle('dark', dark);
    } catch (error) {
      /* localStorage can be unavailable in private mode - keep the default. */
    }
  })();
</script>
</head>
<body class="min-h-screen bg-[#F5F5F7] dark:bg-[#090A0F] text-[#1D1D1F] dark:text-[#F5F5F7] antialiased flex flex-col justify-center selection:bg-[#0071E3] selection:text-white apple-grid relative overflow-x-hidden transition-colors duration-300">
<!-- The NNN Studio interface is rendered by React into this mount point. -->
<div id="root" class="flex-1 flex flex-col"></div>
<script type="module" src="/src/main.tsx"></script>
</body></html>
